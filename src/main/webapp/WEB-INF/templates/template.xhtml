<!DOCTYPE html>
<html lang="#{idiomaBean.idioma}"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="jakarta.faces.core"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui"
>
<f:view locale="#{idiomaBean.locale}">
    <h:head>
        <title><ui:insert name="pageTitle">#{msg['app.title']}</ui:insert></title>
        <h:outputStylesheet
                library="primefaces"
                name="components.css"/>
    </h:head>
    <h:body>
        <h:outputScript library="primefaces" name="locales/locale-#{idiomaBean.idioma}.js" />
        <div class="ui-g">
            <div class="ui-g-1" >
                <ui:insert name="logo">
                    <h:graphicImage library="images" name="GalenoSV_logo_transparente.svg" alt="#{msg['app.logo']}" height="86" width="64"/>
                </ui:insert>
            </div>
            <div class="ui-g-9" >
                <ui:insert name="title">
                   <h1>
                       #{msg['app.title']}
                   </h1>
                </ui:insert>
            </div>
            <div class="ui-g-2" >
                <h:form id="idiomaForm">
                    <h:outputLabel for="idioma" value="#{msg['idioma.label']}" />
                    <h:selectOneMenu id="idioma" value="#{idiomaBean.idioma}" onchange="this.form.submit()">
                        <f:selectItem itemValue="es" itemLabel="Español" />
                        <f:selectItem itemValue="en" itemLabel="English" />
                        <f:selectItem itemValue="fr" itemLabel="Français" />
                        <f:selectItem itemValue="pt" itemLabel="Português" />
                        <f:selectItem itemValue="zh" itemLabel="中文" />
                    </h:selectOneMenu>
                </h:form>
                <ui:insert name="congig-menu">

                </ui:insert>

            </div>
        </div>
        <div class="ui-g">
            <div class="ui-g-2">
                <ui:insert name="menusidebar">
                    #{msg['app.menu']}
                </ui:insert>
            </div>
            <div class="ui-g-10">
                <ui:insert name="content">
                    #{msg['app.content']}
                </ui:insert>
            </div>
        </div>
        <div class="ui-g">
          <ui:insert name="footer">
              #{msg['app.footer']}
          </ui:insert>
        </div>
    </h:body>
</f:view>
</html>
