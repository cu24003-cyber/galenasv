<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"
    xmlns:p="http://primefaces.org/ui" xmlns:ui="jakarta.faces.facelets">

<ui:composition template="/WEB-INF/templates/template.xhtml">
    <ui:define name="pageTitle">#{msg['persona.titulo.lista']}</ui:define>
    <ui:define name="content">
        <p:growl id="messages" showDetail="true" globalOnly="true" life="3000" />

        <h:form id="frmPersonaToolbar">
            <div class="toolbarPersona">
                <p:toolbar id="toolbar-persona">
                    <f:facet name="left">
                        <p:commandButton
                                id="btnNuevaPersona"
                                value="#{msg['boton.nuevaPersona']}"
                                icon="pi pi-plus"
                                update=":personaFormulario" resetValues="true"
                                action="#{registroPersonaModel.nuevo}"
                                process="@this"
                                styleClass="ui-button-success"
                                style="margin-bottom: 10px;"/>
                    </f:facet>
                    <f:facet name="right">
                        <div style="margin-bottom: 10px;">
                                <p:outputLabel for="buscarNombre" value="#{msg['persona.buscar.nombre']}" />
                                <p:inputText id="buscarNombre" value="#{personaModel.nombreBusqueda}"
                                             placeholder="#{msg['persona.buscar.placeholder']}">
                                    <p:ajax event="input" process="@this" listener="#{personaModel.cargarPersonas}"
                                            update=":frmPersonaList:tblPersonas :messages" />
                                </p:inputText>
                        </div>
                    </f:facet>
                </p:toolbar>
                <div style="height:36px"></div>
                <p:sticky target="toolbar-persona" stickyTopAt=".galeno-header"/>
            </div>
        </h:form>

        <p:outputPanel id="personaFormulario" style="margin-bottom: 1rem;">
            <h:panelGroup layout="block" rendered="#{personaModel.seleccionada != null}">
                <h3>#{msg['persona.dialogo.titulo']}: #{personaModel.seleccionada.nombres} #{personaModel.seleccionada.apellidos}</h3>
            </h:panelGroup>
            <p:tabView id="registroTabs" activeIndex="#{registroPersonaModel.pestana}"
                       rendered="#{personaModel.seleccionada != null}">
                <p:tab title="#{msg['entidad.Persona']}">
                    <h:form id="frmDatosPersona">
                        <p:messages showDetail="false" />
                        <p:panelGrid columns="2" layout="grid" styleClass="ui-fluid">
                            <p:outputLabel for="nombres" value="#{msg['persona.campo.nombres']}" />
                            <p:outputPanel>
                            <p:inputText id="nombres" value="#{personaModel.seleccionada.nombres}"
                                         required="true" maxlength="255" validator="#{personaModel.validarNombre}">
                                <f:validateLength maximum="255" />
                            <p:ajax event="blur" process="@this" update="nombresMensaje" />
                            </p:inputText>
                            <p:message id="nombresMensaje" for="nombres" />
                            </p:outputPanel>
                            <p:outputLabel for="apellidos" value="#{msg['persona.campo.apellidos']}" />
                            <p:outputPanel>
                            <p:inputText id="apellidos" value="#{personaModel.seleccionada.apellidos}"
                                         required="true" maxlength="255" validator="#{personaModel.validarNombre}">
                                <f:validateLength maximum="255" />
                            <p:ajax event="blur" process="@this" update="apellidosMensaje" />
                            </p:inputText>
                            <p:message id="apellidosMensaje" for="apellidos" />
                            </p:outputPanel>
                            <p:outputLabel for="birthDate" value="#{msg['persona.campo.fechaNacimiento']}" />
                            <p:outputPanel>
                                <p:datePicker id="birthDate" value="#{personaModel.seleccionada.fechaNacimiento}"
                                              required="true" requiredMessage="#{msg['persona.requerido.fecha']}"
                                              showIcon="true" showOnFocus="false" monthNavigator="true" yearNavigator="true"
                                              maxdate="#{registroPersonaModel.hoy}" timeZone="America/El_Salvador" />
                                <p:message for="birthDate" />
                            </p:outputPanel>
                            <p:outputLabel for="rol" value="#{msg['campo.idRol']}" />
                            <p:autoComplete id="rol" value="#{registroPersonaModel.rol}"
                                            completeMethod="#{registroPersonaModel.completarRoles}"
                                            var="opcion" itemLabel="#{opcion.nombre}" itemValue="#{opcion}"
                                            converter="rolConverter" dropdown="true" forceSelection="true"
                                            required="false" scrollHeight="250" />
                            <p:outputLabel for="clinica" value="#{msg['campo.idClinica']}" />
                            <p:autoComplete id="clinica" value="#{registroPersonaModel.clinica}"
                                            completeMethod="#{registroPersonaModel.completarClinicas}"
                                            var="opcion" itemLabel="#{opcion.nombre}" itemValue="#{opcion}"
                                            converter="clinicaConverter" dropdown="true" forceSelection="true"
                                            scrollHeight="250" />
                        </p:panelGrid>
                        <p>#{msg['registro.rolOpcional']}</p>
                        <p:commandButton value="Nueva asignación" icon="pi pi-plus"
                                         rendered="#{registroPersonaModel.personaGuardada}"
                                         action="#{registroPersonaModel.nuevaAsignacion}" process="@this"
                                         update="@form" resetValues="true" />
                        <p:dataTable value="#{registroPersonaModel.asignaciones}" var="asignacion"
                                     rendered="#{not empty registroPersonaModel.asignaciones}">
                            <p:column headerText="#{msg['campo.idRol']}"><h:outputText value="#{asignacion.idRol.nombre}" /></p:column>
                            <p:column headerText="#{msg['entidad.Clinica']}"><h:outputText value="#{asignacion.idClinica.nombre}" /></p:column>
                            <p:column>
                                <p:commandButton icon="pi pi-pencil" title="#{msg['boton.editar']}"
                                                 action="#{registroPersonaModel.seleccionarAsignacion(asignacion)}"
                                                 process="@this" update="@form" resetValues="true" />
                            </p:column>
                        </p:dataTable>
                        <h:panelGroup layout="block" rendered="#{not registroPersonaModel.personaGuardada}">
                            <p>#{msg['registro.guardarPersonaPrimero']}</p>
                        </h:panelGroup>
                        <p:commandButton value="#{msg['boton.guardar']}" icon="pi pi-check"
                                         action="#{registroPersonaModel.guardarPersona}" process="@form"
                                         update=":personaFormulario :frmPersonaList:tblPersonas :messages" />
                        <p:commandButton value="#{msg['boton.cancelar']}" icon="pi pi-times"
                                         action="#{registroPersonaModel.cancelar}" process="@form" immediate="true"
                                         update=":personaFormulario" resetValues="true" styleClass="ui-button-secondary" />
                    </h:form>
                </p:tab>
                <p:tab title="#{msg['entidad.Documento']}" disabled="#{not registroPersonaModel.personaGuardada}">
                    <h:form id="frmDocumento">
                        <p:messages showDetail="false" />
                        <p:commandButton value="#{msg['registro.nuevo']}" icon="pi pi-plus"
                                         rendered="#{not registroPersonaModel.documentoVisible}"
                                         action="#{registroPersonaModel.nuevoDocumento}" process="@this" update="@form" resetValues="true" />
                        <h:panelGroup layout="block" styleClass="galeno-formulario" rendered="#{registroPersonaModel.documentoVisible}">
                        <p:panelGrid columns="2" layout="grid" styleClass="ui-fluid">
                            <p:outputLabel for="tipo" value="#{msg['campo.idTipoDocumento']}" />
                            <p:autoComplete id="tipo" value="#{registroPersonaModel.documento.idTipoDocumento}"
                                            completeMethod="#{registroPersonaModel.completarTiposDocumento}"
                                            var="tipo" itemLabel="#{tipo.nombre}" itemValue="#{tipo}"
                                            converter="tipoDocumentoConverter" dropdown="true" forceSelection="true"
                                            required="true" scrollHeight="250">
                                <p:ajax event="itemSelect" process="@this" update="indicaciones valorPanel"
                                        listener="#{registroPersonaModel.cambiarTipoDocumento}" resetValues="true" />
                                <p:ajax event="clear" process="@this" update="@this indicaciones valorPanel" immediate="true"
                                        listener="#{registroPersonaModel.limpiarTipoDocumento}" resetValues="true" />
                            </p:autoComplete>
                            <p:outputLabel for="valor" value="#{msg['campo.valor']}" />
                            <p:outputPanel id="valorPanel">
                                <p:inputMask id="valor" value="#{registroPersonaModel.documento.valor}"
                                             mask="#{registroPersonaModel.mascaraDocumento}"
                                             autoClear="false" validateMask="false"
                                             disabled="#{registroPersonaModel.documento.idTipoDocumento == null}"
                                             required="true" maxlength="255">
                                    <f:validator validatorId="valorCatalogoValidator" />
                                    <f:attribute name="expresionRegular"
                                                 value="#{registroPersonaModel.documento.idTipoDocumento.expresionRegular}" />
                                    <f:validateLength maximum="255" />
                                    <p:ajax event="blur" process="@this" update="valorMensaje" />
                                </p:inputMask>
                                <p:message id="valorMensaje" for="valor" />
                            </p:outputPanel>
                            <h:outputText value="#{msg['campo.indicaciones']}" />
                            <h:outputText id="indicaciones" value="#{registroPersonaModel.documento.idTipoDocumento.indicaciones}" />
                            <p:outputLabel for="ruta" value="#{msg['campo.rutaFisica']}" />
                            <p:inputText id="ruta" value="#{registroPersonaModel.documento.rutaFisica}" maxlength="255">
                                <f:validateLength maximum="255" />
                            </p:inputText>
                        </p:panelGrid>
                        <p:commandButton value="#{msg['boton.guardar']}" icon="pi pi-check"
                                         action="#{registroPersonaModel.guardarDocumento}" process="@form"
                                         update="@form :messages" />
                        <p:commandButton value="#{msg['boton.cancelar']}" icon="pi pi-times"
                                         action="#{registroPersonaModel.cancelarDocumento}" process="@form" immediate="true"
                                         update="@form" resetValues="true" styleClass="ui-button-secondary" />
                        </h:panelGroup>
                        <p:dataTable value="#{registroPersonaModel.documentos}" var="registro" rows="5"
                                     paginator="true" paginatorPosition="bottom" emptyMessage="#{msg['tabla.vacia']}">
                            <p:column headerText="#{msg['campo.tipo']}">
                                <h:outputText value="#{registro.idTipoDocumento.nombre}" />
                            </p:column>
                            <p:column headerText="#{msg['campo.valor']}">
                                <h:outputText value="#{registro.valor}" />
                            </p:column>
                            <p:column headerText="#{msg['campo.rutaFisica']}">
                                <h:outputText value="#{registro.rutaFisica}" />
                            </p:column>
                            <p:column headerText="#{msg['persona.columna.acciones']}">
                                <p:commandButton icon="pi pi-trash" title="#{msg['boton.eliminar']}"
                                                 ariaLabel="#{msg['boton.eliminar']}" styleClass="ui-button-danger"
                                                 action="#{registroPersonaModel.eliminarDocumento(registro)}"
                                                 process="@this" update="@form :messages">
                                    <p:confirm header="#{msg['persona.confirmar.header']}"
                                               message="#{msg['registro.confirmarEliminar']}" />
                                </p:commandButton>
                            </p:column>
                        </p:dataTable>
                    </h:form>
                </p:tab>
                <p:tab title="#{msg['entidad.MedioContacto']}" disabled="#{not registroPersonaModel.personaGuardada}">
                    <h:form id="frmContacto">
                        <p:messages showDetail="false" />
                        <p:commandButton value="#{msg['registro.nuevo']}" icon="pi pi-plus"
                                         rendered="#{not registroPersonaModel.contactoVisible}"
                                         action="#{registroPersonaModel.nuevoContacto}" process="@this" update="@form" resetValues="true" />
                        <h:panelGroup layout="block" styleClass="galeno-formulario" rendered="#{registroPersonaModel.contactoVisible}">
                        <p:panelGrid columns="2" layout="grid" styleClass="ui-fluid">
                            <p:outputLabel for="tipo" value="#{msg['campo.idTipoMedioContacto']}" />
                            <p:autoComplete id="tipo" value="#{registroPersonaModel.contacto.idTipoMedioContacto}"
                                            completeMethod="#{registroPersonaModel.completarTiposContacto}"
                                            var="tipo" itemLabel="#{tipo.nombre}" itemValue="#{tipo}"
                                            converter="tipoMedioContactoConverter" dropdown="true" forceSelection="true"
                                            required="true" scrollHeight="250">
                                <p:ajax event="itemSelect" process="@this" update="indicaciones valorPanel"
                                        listener="#{registroPersonaModel.cambiarTipoContacto}" resetValues="true" />
                                <p:ajax event="clear" process="@this" update="@this indicaciones valorPanel" immediate="true"
                                        listener="#{registroPersonaModel.limpiarTipoContacto}" resetValues="true" />
                            </p:autoComplete>
                            <p:outputLabel for="valor" value="#{msg['campo.valor']}" />
                            <p:outputPanel id="valorPanel">
                                <p:inputMask id="valor" value="#{registroPersonaModel.contacto.valor}"
                                             mask="#{registroPersonaModel.mascaraContacto}"
                                             autoClear="false" validateMask="false"
                                             disabled="#{registroPersonaModel.contacto.idTipoMedioContacto == null}"
                                             required="true" maxlength="255">
                                    <f:validator validatorId="valorCatalogoValidator" />
                                    <f:attribute name="expresionRegular"
                                                 value="#{registroPersonaModel.contacto.idTipoMedioContacto.expresionRegular}" />
                                    <f:validateLength maximum="255" />
                                    <p:ajax event="blur" process="@this" update="valorMensaje" />
                                </p:inputMask>
                                <p:message id="valorMensaje" for="valor" />
                            </p:outputPanel>
                            <h:outputText value="#{msg['campo.indicaciones']}" />
                            <h:outputText id="indicaciones" value="#{registroPersonaModel.contacto.idTipoMedioContacto.indicaciones}" />
                        </p:panelGrid>
                        <p:commandButton value="#{msg['boton.guardar']}" icon="pi pi-check"
                                         action="#{registroPersonaModel.guardarContacto}" process="@form"
                                         update="@form :messages" />
                        <p:commandButton value="#{msg['boton.cancelar']}" icon="pi pi-times"
                                         action="#{registroPersonaModel.cancelarContacto}" process="@form" immediate="true"
                                         update="@form" resetValues="true" styleClass="ui-button-secondary" />
                        </h:panelGroup>
                        <p:dataTable value="#{registroPersonaModel.contactos}" var="registro" rows="5"
                                     paginator="true" paginatorPosition="bottom" emptyMessage="#{msg['tabla.vacia']}">
                            <p:column headerText="#{msg['campo.tipo']}">
                                <h:outputText value="#{registro.idTipoMedioContacto.nombre}" />
                            </p:column>
                            <p:column headerText="#{msg['campo.valor']}">
                                <h:outputText value="#{registro.valor}" />
                            </p:column>
                            <p:column headerText="#{msg['persona.columna.acciones']}">
                                <p:commandButton icon="pi pi-trash" title="#{msg['boton.eliminar']}"
                                                 ariaLabel="#{msg['boton.eliminar']}" styleClass="ui-button-danger"
                                                 action="#{registroPersonaModel.eliminarContacto(registro)}"
                                                 process="@this" update="@form :messages">
                                    <p:confirm header="#{msg['persona.confirmar.header']}"
                                               message="#{msg['registro.confirmarEliminar']}" />
                                </p:commandButton>
                            </p:column>
                        </p:dataTable>
                    </h:form>
                </p:tab>
            </p:tabView>
        </p:outputPanel>

        <h:form id="frmPersonaList">
            <p:dataTable var="p" value="#{personaModel.personas}" id="tblPersonas" paginator="true" rows="10"
                first="#{personaModel.primeraFila}" paginatorPosition="bottom" emptyMessage="#{msg['tabla.vacia']}">
                <p:column headerText="#{msg['persona.columna.nombres']}">
                    <h:outputText value="#{p.nombres}" />
                </p:column>
                <p:column headerText="#{msg['persona.columna.apellidos']}">
                    <h:outputText value="#{p.apellidos}" />
                </p:column>
                <p:column headerText="#{msg['persona.columna.fechaNacimiento']}">
                    <h:outputText value="#{p.fechaNacimiento}">
                        <f:convertDateTime pattern="dd/MM/yyyy" timeZone="America/El_Salvador" />
                    </h:outputText>
                </p:column>
                <p:column headerText="#{msg['persona.columna.acciones']}" style="width: 150px; text-align: center;">
                    <p:commandButton title="#{msg['boton.editar']}" ariaLabel="#{msg['boton.editar']}" icon="pi pi-pencil" update=":personaFormulario" resetValues="true"
                        actionListener="#{registroPersonaModel.editar(p)}" process="@this" styleClass="rounded-button ui-button-info"
                        style="margin-right: 5px;" />
                    <p:commandButton title="#{msg['boton.eliminar']}" ariaLabel="#{msg['boton.eliminar']}" icon="pi pi-trash" actionListener="#{personaModel.eliminar(p)}"
                        update=":frmPersonaList:tblPersonas :messages" process="@this"
                        styleClass="rounded-button ui-button-danger">
                        <p:confirm header="#{msg['persona.confirmar.header']}" message="#{msg['persona.confirmar.mensaje']}"
                            icon="pi pi-exclamation-triangle" />
                    </p:commandButton>
                </p:column>
            </p:dataTable>
            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade" responsive="true" width="350">
                <p:commandButton value="#{msg['boton.no']}" type="button" styleClass="ui-confirmdialog-no ui-button-flat" />
                <p:commandButton value="#{msg['boton.si']}" type="button" styleClass="ui-confirmdialog-yes ui-button-danger" />
            </p:confirmDialog>
        </h:form>

    </ui:define>
</ui:composition>
</html>
